name: Build & Release

# Trigger: push a version tag like  git tag v3.0.1 && git push origin v3.0.1
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # needed to create GitHub releases and upload assets

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-cmd: build:electron:win
          - os: macos-latest
            build-cmd: build:electron:mac
          - os: ubuntu-latest
            build-cmd: build:electron:linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder reads GH_TOKEN to publish the release artifacts
      - name: Build & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.build-cmd }} -- --publish always
